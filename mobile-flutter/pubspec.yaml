name: stockpilot_mobile
description: StockPilot Operational Mobile Application for inventory scanning, stock adjustments, batch receipts, inter-branch transfers, and demand tracking.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0
  flutter_secure_storage: ^9.2.4
  mobile_scanner: ^5.2.3
  intl: ^0.19.0
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
