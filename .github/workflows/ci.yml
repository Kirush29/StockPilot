name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend Build & Test (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        run: dotnet restore backend/StockPilot.sln
      - name: Build solution
        run: dotnet build --no-restore backend/StockPilot.sln
      - name: Run unit & integration tests
        run: dotnet test --no-build --verbosity normal backend/StockPilot.sln

  web-ci:
    name: Web Frontend Build & Lint (React 19)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: ./web
        run: npm ci
      - name: Run Linter
        working-directory: ./web
        run: npm run lint
      - name: Build Web Application
        working-directory: ./web
        run: npm run build
